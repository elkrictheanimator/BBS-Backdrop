pluginManagement {
	plugins {
		id 'fabric-loom' version (settings.providers.gradleProperty('loom_version').getOrElse('1.15-SNAPSHOT'))
	}
	repositories {
		maven {
			name = 'Fabric'
			url = 'https://maven.fabricmc.net/'
		}
		mavenCentral()
		gradlePluginPortal()
	}
}

rootProject.name = 'bbs-backdrop'
