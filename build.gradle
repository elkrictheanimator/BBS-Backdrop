plugins {
	id 'fabric-loom' version '1.15-SNAPSHOT'
}

/* One source tree, several builds: targets/<target>.properties names the Minecraft version, the
 * mappings and the BBS to compile against; src/compat/<compat> holds the few classes that differ. */
def targetProps = new Properties()
file("targets/${project.target}.properties").withInputStream { targetProps.load(it) }
targetProps.each { k, v -> project.ext.set(k, v) }

version = project.mod_version + "-" + project.target
group = project.maven_group

sourceSets.main.java.srcDir "src/compat/${project.compat}/java"

base {
	archivesName = project.archives_base_name
}

repositories {
	/* BBS is published here by `gradlew publishToMavenLocal` in the BBS repository. There is no
	 * public repository for it. */
	mavenLocal()
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

	/* transitive = false keeps BBS's own Sodium, Iris and glsl-transformer out of this build.
	 * The consequence is worth knowing: the dev client then runs BBS without Sodium and Iris, its
	 * mixins into them are skipped with a warning, and nothing that depends on shaders is
	 * exercised here. */
	modImplementation("${project.bbs_group}:${project.bbs_artifact}:${project.bbs_version}") { transitive = false }
}

/* Loom caches the remapped BBS by its Maven coordinates, and BBS's version does not change while
 * it is being worked on — so a rebuilt BBS is silently ignored, and it looks exactly like the
 * changes to BBS not existing. A flag one has to remember is a flag one forgets, so this notices
 * on its own: if the published jar is newer than the cached remap, the cache goes. */
def bbsJar = new File(new File(System.getProperty("user.home")), ".m2/repository/${project.bbs_group}/${project.bbs_artifact}/${project.bbs_version}/${project.bbs_artifact}-${project.bbs_version}.jar")
def remapCache = file(".gradle/loom-cache/remapped_mods/remapped/mchorse")

if (bbsJar.exists() && remapCache.exists() && bbsJar.lastModified() > remapCache.lastModified()) {
	logger.lifecycle("BBS was rebuilt since it was last remapped — clearing ${remapCache}")
	delete(remapCache)
}

processResources {
	inputs.property "version", project.version

	inputs.property "mc", project.minecraft_version
	inputs.property "java", project.java_version

	filesMatching("fabric.mod.json") {
		expand "version": project.version, "minecraft": project.minecraft_version, "java": project.java_version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = project.java_version.toInteger()
}

java {
	sourceCompatibility = JavaVersion.toVersion(project.java_version)
	targetCompatibility = JavaVersion.toVersion(project.java_version)
}
