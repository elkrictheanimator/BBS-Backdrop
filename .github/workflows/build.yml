name: Build

on:
  push:
    branches: [ '**' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [ fs-1.20.4, fs-1.20.1, fs-1.21.1, cml-1.20.1, cml-1.20.4, cml-1.21.1, cml-1.21.4 ]
    steps:
      - uses: actions/checkout@v4

      - name: Read the target
        id: t
        run: |
          get() { grep "^$1=" targets/${{ matrix.target }}.properties | cut -d= -f2-; }
          echo "repo=$(get bbs_repo)" >> "$GITHUB_OUTPUT"
          echo "ref=$(get bbs_ref)" >> "$GITHUB_OUTPUT"
          echo "mode=$(get bbs_mode)" >> "$GITHUB_OUTPUT"

      # The addon compiles against BBS, which has no public Maven repository: build the right BBS
      # (a branch of the repository the target names) into the local Maven first.
      - uses: actions/checkout@v4
        with:
          repository: ${{ steps.t.outputs.repo }}
          ref: ${{ steps.t.outputs.ref }}
          path: bbs

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Publish BBS to the local Maven
        if: steps.t.outputs.mode == 'maven'
        run: |
          cd bbs
          chmod +x gradlew
          ./gradlew publishToMavenLocal --no-daemon -Dorg.gradle.jvmargs=-Xmx3G

      # BBS CML is not made for publishing: its remapped jar is what the addon compiles against.
      - name: Build BBS into a jar
        if: steps.t.outputs.mode == 'jar'
        run: |
          cd bbs
          chmod +x gradlew
          ./gradlew remapJar --no-daemon -Dorg.gradle.jvmargs=-Xmx3G
          mkdir -p ../bbs-jar
          cp "$(ls build/libs/*.jar | grep -v -e sources -e dev | head -1)" ../bbs-jar/bbs.jar
          ls -la ../bbs-jar

      - name: Build the addon
        run: |
          chmod +x gradlew
          set +e
          ./gradlew build --no-daemon -Ptarget=${{ matrix.target }} -Dorg.gradle.jvmargs=-Xmx3G > build.log 2>&1
          code=$?
          tail -n 40 build.log
          if [ "$code" != "0" ]; then
            grep -E "error:|What went wrong" -A2 build.log | head -40 | while IFS= read -r line; do echo "::error::${{ matrix.target }} $line"; done
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: jar-${{ matrix.target }}
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar

  # A test build anyone with access can download from the Releases page: one jar per BBS build that compiled.
  release:
    needs: build
    if: github.ref == 'refs/heads/master' && !cancelled()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: jars
          pattern: jar-*
          merge-multiple: true

      - name: Test release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls jars
          gh release create "test-${{ github.run_number }}" jars/*.jar --repo "${{ github.repository }}" --prerelease \
            --title "Test build ${{ github.run_number }}" \
            --notes "Test build from commit ${{ github.sha }}. One jar per BBS build (name ends with the target). Not for public release."
