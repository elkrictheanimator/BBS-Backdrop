name: Build

on:
  push:
    branches: [ '**' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [ fs-1.20.4, fs-1.20.1 ]
    steps:
      - uses: actions/checkout@v4

      - name: Read the target
        id: t
        run: |
          get() { grep "^$1=" targets/${{ matrix.target }}.properties | cut -d= -f2-; }
          echo "repo=$(get bbs_repo)" >> "$GITHUB_OUTPUT"
          echo "ref=$(get bbs_ref)" >> "$GITHUB_OUTPUT"
          echo "mode=$(get bbs_mode)" >> "$GITHUB_OUTPUT"
          echo "loom=$(get loom_version)" >> "$GITHUB_OUTPUT"
          echo "gradle=$(get gradle_version)" >> "$GITHUB_OUTPUT"

      # The addon compiles against BBS, which has no public Maven repository: build the right BBS
      # (a branch of the repository the target names) into the local Maven first.
      - uses: actions/checkout@v4
        with:
          repository: ${{ steps.t.outputs.repo }}
          ref: ${{ steps.t.outputs.ref }}
          path: bbs

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Publish BBS to the local Maven
        if: steps.t.outputs.mode == 'maven'
        run: |
          cd bbs
          chmod +x gradlew
          ./gradlew publishToMavenLocal --no-daemon -Dorg.gradle.jvmargs=-Xmx3G

      # BBS CML is not made for publishing: its remapped jar is what the addon compiles against.
      - name: Build BBS into a jar
        if: steps.t.outputs.mode == 'jar'
        run: |
          cd bbs
          chmod +x gradlew
          ./gradlew remapJar --no-daemon -Dorg.gradle.jvmargs=-Xmx3G
          mkdir -p ../bbs-jar
          cp "$(ls build/libs/*.jar | grep -v -e sources -e dev | head -1)" ../bbs-jar/bbs.jar
          ls -la ../bbs-jar

      - name: Build the addon
        run: |
          chmod +x gradlew
          # BBS CML is built with a newer Loom (and Gradle) than the FS builds; the addon must match it.
          if [ -n "${{ steps.t.outputs.gradle }}" ]; then
            sed -i "s#gradle-[0-9.]*-bin.zip#gradle-${{ steps.t.outputs.gradle }}-bin.zip#" gradle/wrapper/gradle-wrapper.properties
          fi
          set +e
          ./gradlew build --no-daemon -Ptarget=${{ matrix.target }} ${{ steps.t.outputs.loom && format('-Ploom_version={0}', steps.t.outputs.loom) || '' }} -Dorg.gradle.jvmargs=-Xmx3G > build.log 2>&1
          code=$?
          tail -n 40 build.log
          if [ "$code" != "0" ]; then
            grep -E "error:|What went wrong" -A2 build.log | head -40 | while IFS= read -r line; do echo "::error::${{ matrix.target }} $line"; done
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: jar-${{ matrix.target }}
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar

  # The release on the Releases page: one jar per BBS build that compiled.
  release:
    needs: build
    if: github.ref == 'refs/heads/master' && !cancelled()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: jars
          pattern: jar-*
          merge-multiple: true

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls jars
          repo="${{ github.repository }}"
          version="$(grep '^mod_version=' gradle.properties | cut -d= -f2)"
          # The old test builds are gone for good; the release of this version is made fresh from this commit.
          for tag in $(gh release list --repo "$repo" --limit 200 --json tagName --jq '.[].tagName' | grep -E '^test-' || true); do
            gh release delete "$tag" --repo "$repo" --yes --cleanup-tag || true
          done
          gh release delete "v$version" --repo "$repo" --yes --cleanup-tag || true
          gh release create "v$version" jars/*.jar --repo "$repo" --latest \
            --title "BBS Wallpaper $version" \
            --notes "BBS Wallpaper $version. Jars: BBS-Wallpaper-$version-fs-1.20.4.jar for BBS FS on Minecraft 1.20.4; BBS-Wallpaper-Port-$version-fs-1.20.1.jar for BBS FS on Minecraft 1.20.1. Java 17."
